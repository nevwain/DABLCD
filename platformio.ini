[platformio]
default_envs = uno_r4_minima

; Arduino UNO R4 Minima (default)
[env:uno_r4_minima]
platform = arduino
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit RGB LCD Shield Library@^1.0.0
    # Add DABShield library if available in a registry, otherwise it should be in lib/
lib_ignore = 

; Arduino UNO R4 WiFi
[env:uno_r4_wifi]
platform = arduino
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit RGB LCD Shield Library@^1.0.0

; Arduino Zero (SAMD21)
[env:arduino_zero]
platform = atmelsam
board = arduino_zero
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit RGB LCD Shield Library@^1.0.0
    khoih-prog/FlashStorage_SAMD@^1.3.2

; Arduino M0
[env:arduino_m0]
platform = atmelsam
board = mzero_pro
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit RGB LCD Shield Library@^1.0.0
    khoih-prog/FlashStorage_SAMD@^1.3.2

; Arduino Due
[env:arduino_due]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit RGB LCD Shield Library@^1.0.0
    khoih-prog/DueFlashStorage@^1.0.0

; ESP32 D1 R32
[env:esp32_d1_r32]
platform = espressif32
board = wemos_d1_uno32
framework = arduino
monitor_speed = 115200
monitor_port = COM3
lib_deps =
    adafruit/Adafruit RGB LCD Shield Library@^1.0.0
